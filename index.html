<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Gestor de Torneios e Liga Edison Format - Yu-Gi-Oh! TCG" />
    <title>Edison League - Yu-Gi-Oh! Tournament Manager</title>

    <!-- PWA & iOS Safari Home Screen Meta Tags -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Edison League" />

    <script>
      (function() {
        // Garantir trailing slash para evitar que o iOS abra a raiz do GitHub Pages
        if (!window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
          return;
        }
        // Assegurar URL absoluta exata para os links de ícone do iOS
        try {
          var base = window.location.origin + window.location.pathname;
          if (!base.endsWith('/')) {
            base = base.substring(0, base.lastIndexOf('/') + 1);
          }
          var touchIcons = document.querySelectorAll('link[rel*="apple-touch-icon"]');
          touchIcons.forEach(function(el) {
            el.href = base + 'apple-touch-icon.png';
          });
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Cinzel & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
